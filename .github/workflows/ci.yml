name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# A new push or edit of a pull request cancels the run still going for that pull request. Runs of
# other pull requests never share a group, and a manual run (workflow_dispatch has no pull request
# number) gets a group of its own, so it neither cancels nor is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Timeouts are a few times each job's usual length (checks under 1 min, node about 3-4 min,
  # leak-check under 1 min), so a hung run stops early instead of after GitHub's 6 hours.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # -I and a directory outside the checkout: a venv.py or venv/ in the pull request
      # cannot replace the standard library module that builds the tools' environment
      # (its bin/ goes first on PATH for every later step).
      - name: Create a virtual environment for tools
        run: |
          cd "$RUNNER_TEMP"
          python3 -I -m venv venv
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install ruff
        env:
          RUFF_VERSION: "0.15.8"
        run: |
          cd "$RUNNER_TEMP"
          venv/bin/pip install --quiet "ruff==$RUFF_VERSION"

      # --no-respect-gitignore: a .gitignore or .ignore added in any folder must not
      # hide files from the linter; ruff's default excludes (.git, .venv, venv) still apply.
      - name: Lint
        run: ruff check --no-respect-gitignore .

      # -I: a module at the repository root (a unittest/ package) cannot replace the
      # standard library and print a fake OK. Zero tests, or no "Ran N tests" line,
      # fails the step. No pipe: GitHub runs this as `bash -e` without pipefail, so
      # the exit status is taken from python3 itself. tests/test_ci_steps.py runs
      # this block as written.
      - name: Unit tests
        run: |
          status=0
          python3 -I -m unittest discover -s tests -v > "$RUNNER_TEMP/unit-tests.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/unit-tests.log"
          ran=$(sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' "$RUNNER_TEMP/unit-tests.log" | tail -n 1)
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "unit tests did not run: ${ran:-no} tests ran"
            exit 1
          fi
          exit "$status"

      # The benchmark's own tests, with the same guard as the gate's tests.
      # tests/test_ci_steps.py runs this block as written.
      - name: Bench tests
        run: |
          status=0
          node --test --test-reporter=tap bench/test/*.test.js > "$RUNNER_TEMP/bench-tests.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/bench-tests.log"
          ran=$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/bench-tests.log" | tail -n 1)
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "bench tests did not run: ${ran:-no} tests ran"
            exit 1
          fi
          exit "$status"

  # The gate and the benchmark on every Node version users are expected to have. Each version is
  # an exact official release from nodejs.org, checked against the SHA-256 pinned here (taken from
  # that release's SHASUMS256.txt when the version was chosen), not read at run time.
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - node: "20.20.2"
            sha256: "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d"
          - node: "22.23.3"
            sha256: "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de"
          - node: "24.21.0"
            sha256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
    steps:
      - name: Check out with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # tests/test_ci_steps.py runs this block as written, with a stand-in for curl.
      - name: Install Node (official release, checksum pinned)
        env:
          NODE_VERSION: ${{ matrix.node }}
          NODE_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/node"
          curl -sSfL -o "$RUNNER_TEMP/node.tar.xz" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"

      # The steps below must run on the Node just installed, not on the runner's own: a PATH that
      # did not take effect fails here. tests/test_ci_steps.py runs this block as written.
      - name: Check the Node version
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          found=$(node --version)
          if [ "$found" != "v$NODE_VERSION" ]; then
            echo "node is $found, not v$NODE_VERSION"
            exit 1
          fi
          echo "node $found"

      # The gate's tests, with the same guard as the unit tests: zero tests, or no "# tests N"
      # line, fails the step. The TAP reporter keeps the summary lines stable across Node
      # versions; Node 22 turns a glob that matches nothing into "# tests 0" and exit 0.
      # tests/test_ci_steps.py runs this block as written.
      - name: Gate tests
        run: |
          node --version
          status=0
          node --test --test-reporter=tap gate/test/*.test.js > "$RUNNER_TEMP/gate-tests.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gate-tests.log"
          ran=$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/gate-tests.log" | tail -n 1)
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "gate tests did not run: ${ran:-no} tests ran"
            exit 1
          fi
          exit "$status"

      # The benchmark runs again and its RESULTS.md and results.json must equal the committed ones,
      # apart from the header (commit, date, Node and Python versions): the published numbers never
      # drift from what the code does. A difference, a failed run or a run with no summary or no cases
      # fails the step. tests/test_ci_steps.py runs this block as written.
      - name: Bench numbers
        run: |
          node bench/run --out "$RUNNER_TEMP/bench"
          fresh="$RUNNER_TEMP/bench"
          if ! grep -q '^| All fakes ' "$fresh/RESULTS.md" || ! grep -q '^  "cases": \[' "$fresh/results.json"; then
            echo "bench did not run: no summary or no cases in $fresh"
            exit 1
          fi
          header='^(- (Commit|Date|Node|Python): |  "(commit|date|node|python)": )'
          for file in RESULTS.md results.json; do
            if ! diff <(grep -Ev "$header" "bench/$file") <(grep -Ev "$header" "$fresh/$file"); then
              echo "bench/$file differs from this run: run node bench/run and commit bench/RESULTS.md and bench/results.json"
              exit 1
            fi
          done
          echo "bench/RESULTS.md and bench/results.json match this run"

  # A separate job: no test or tool from the PR runs before the leak check, so
  # nothing can rewrite its environment (GITHUB_ENV, GITHUB_PATH) first.
  leak-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install gitleaks (official release, checksum pinned)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # PR title, body and SHAs reach the script only through env, never
      # through ${{ }} inside run: (that would allow command injection).
      # A missing LEAK_PATTERNS secret makes the pattern scan "did not run",
      # which exits 2 and fails this step.
      - name: Leak check
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # -I: a module added next to the script cannot replace the standard library.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -I scripts/leak-check --all-history
          else
            python3 -I scripts/leak-check
          fi
